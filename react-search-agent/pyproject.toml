[project]
name = "react-search-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kyrylo Rybalko", email = "kay.dev.uk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
    "isort>=9.0.2",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.3",
    "tavily-python>=0.8.4",
]

[project.scripts]
react-search-agent = "react_search_agent:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
